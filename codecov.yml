coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
ignore:
  - "examples/**"
  - "scripts/**"
  - "**/*.test.ts"
  - "**/dist/**"
github_checks:
  annotations: true
