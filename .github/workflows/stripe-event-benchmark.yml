name: Stripe event benchmark
on:
  push:
    branches: [codex/stripe-event-benchmark-ci]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: b98f11c
          path: baseline
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - name: Build both revisions
        run: |
          for root in baseline candidate; do
            cd "$GITHUB_WORKSPACE/$root"
            pnpm install --frozen-lockfile
            pnpm -r --filter @hibiki-js/core --filter @hibiki-js/stripe --filter @hibiki-js/github --filter @hibiki-js/discord build
          done
      - name: Compare alternating requests three times
        working-directory: candidate
        run: |
          mkdir -p benchmarks/results
          for repeat in 1 2 3; do
            node benchmarks/compare.mjs --baseline ../baseline --output "benchmarks/results/paired-$repeat.json"
          done
          node benchmarks/size.mjs --output benchmarks/results/size-candidate.json
          cd ../baseline
          node benchmarks/size.mjs --output ../candidate/benchmarks/results/size-baseline.json
      - uses: actions/upload-artifact@v7
        with:
          name: stripe-event-benchmarks
          path: candidate/benchmarks/results
