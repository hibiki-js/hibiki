name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:dependencies
      - run: pnpm check:agent-docs
      - run: pnpm check:evals
      - run: pnpm typecheck
      - run: pnpm check:examples
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm docs:build
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false
        if: github.event_name != 'merge_group'
  bun:
    name: bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.3" }
      - run: bun --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime
      - run: pnpm test:bun
  deno:
    name: deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: "2.9.6" }
      - run: deno --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime
      - run: pnpm test:deno
  workerd:
    name: workerd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime
      - run: pnpm typecheck:runtime
      - run: pnpm test:workerd
