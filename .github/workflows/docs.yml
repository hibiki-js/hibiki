name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-pages:
    if: github.repository == 'hibiki-js/hibiki'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hibiki-js.github.io deploy
        env:
          GH_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Docs deploy not triggered::DOCS_DEPLOY_TOKEN is missing; the Pages repository's scheduled deploy will publish the latest main branch."
            {
              echo "### Docs deploy was not triggered immediately"
              echo "DOCS_DEPLOY_TOKEN is not set. The Pages repository's scheduled deployment will publish the latest main branch."
              echo "To restore immediate deploys, configure a fine-grained token with Actions:write on hibiki-js/hibiki-js.github.io as this repository's DOCS_DEPLOY_TOKEN secret."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run deploy.yml \
            --repo hibiki-js/hibiki-js.github.io \
            -f ref="${{ github.sha }}"
